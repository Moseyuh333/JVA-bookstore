<!DOCTYPE html>
<html>
<head>
    <title>Admin - User Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .action-btn { margin: 2px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h2>🔧 Admin - User Management</h2>
            </div>
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5>Clear Verification Tokens</h5>
                                <p class="small text-muted">Remove all verification tokens and mark users as verified</p>
                                <button class="btn btn-warning" onclick="clearTokens()">
                                    🗑️ Clear Tokens
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5>Verify All Users</h5>
                                <p class="small text-muted">Mark all existing users as email verified</p>
                                <button class="btn btn-success" onclick="verifyAll()">
                                    ✅ Verify All
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5>List All Users</h5>
                                <p class="small text-muted">View all users in database</p>
                                <button class="btn btn-info" onclick="listUsers()">
                                    📋 List Users
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="result" class="mt-3"></div>
                
                <div id="userList" class="mt-4"></div>
            </div>
        </div>
    </div>
    
    <script>
        async function clearTokens() {
            if (!confirm('Clear all verification tokens and mark users as verified?')) return;
            await executeAction('clear-tokens', 'Verification tokens cleared successfully');
        }
        
        async function verifyAll() {
            if (!confirm('Mark all users as email verified?')) return;
            await executeAction('verify-all', 'All users marked as verified');
        }
        
        async function listUsers() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="alert alert-info">Loading users...</div>';
            
            try {
                const response = await fetch('/api/admin/users?action=list');
                const data = await response.json();
                
                if (response.ok && data.users) {
                    displayUsers(data.users);
                    resultDiv.innerHTML = `<div class="alert alert-success">Loaded ${data.users.length} users</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error || 'Failed to load users'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }
        
        async function executeAction(action, successMsg) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="alert alert-info">Processing...</div>';
            
            try {
                const response = await fetch(`/api/admin/users?action=${action}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="alert alert-success"><strong>✅ Success!</strong><br>${successMsg}<br>Affected rows: ${data.affected || 0}</div>`;
                    setTimeout(() => listUsers(), 1000);
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger"><strong>❌ Error</strong><br>${data.error || 'Unknown error'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger"><strong>❌ Error</strong><br>${error.message}</div>`;
            }
        }
        
        function displayUsers(users) {
            const userListDiv = document.getElementById('userList');
            
            if (users.length === 0) {
                userListDiv.innerHTML = '<div class="alert alert-warning">No users found</div>';
                return;
            }
            
            let html = '<h4>Users List</h4><div class="table-responsive"><table class="table table-striped table-hover"><thead class="table-dark"><tr>';
            html += '<th>ID</th><th>Username</th><th>Email</th><th>Verified</th><th>Has Token</th><th>Created</th>';
            html += '</tr></thead><tbody>';
            
            users.forEach(user => {
                html += '<tr>';
                html += `<td>${user.id}</td>`;
                html += `<td><strong>${user.username}</strong></td>`;
                html += `<td>${user.email}</td>`;
                html += `<td>${user.verified ? '<span class="badge bg-success">✓ Yes</span>' : '<span class="badge bg-danger">✗ No</span>'}</td>`;
                html += `<td>${user.hasToken ? '<span class="badge bg-warning">Yes</span>' : '<span class="badge bg-secondary">No</span>'}</td>`;
                html += `<td>${new Date(user.created).toLocaleString()}</td>`;
                html += '</tr>';
            });
            
            html += '</tbody></table></div>';
            userListDiv.innerHTML = html;
        }
        
        // Load users on page load
        window.addEventListener('load', listUsers);
    </script>
</body>
</html>
