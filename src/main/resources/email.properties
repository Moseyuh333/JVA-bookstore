# Email Configuration
# WARNING: Use environment variables for credentials in production!
# Set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM as env vars.
smtp.host=${SMTP_HOST:smtp.us-west-1.mailertogo.net}
smtp.port=${SMTP_PORT:587}
smtp.user=${SMTP_USER:}
smtp.pass=${SMTP_PASS:}
smtp.from=${SMTP_FROM:noreply@nkbookstore.com}
mail.smtp.auth=true
mail.smtp.starttls.enable=true
emailjs.service.id=${EMAILJS_SERVICE_ID:}
emailjs.public.key=${EMAILJS_PUBLIC_KEY:}
emailjs.template.register=${EMAILJS_TEMPLATE_REGISTER:}
emailjs.template.reset=${EMAILJS_TEMPLATE_RESET:}
emailjs.from.name=Nkbookstore
